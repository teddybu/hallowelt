<!DOCTYPE html>
<html lang="de">
<head>
    <meta charset="UTF-8">
    <title>Three.js 3D Farbbox Drag</title>
    <style>
        #farbbox {
            width: 200px;
            height: 200px;
            background-color: #2be27a; /* Fallback */
            position: absolute; /* Wichtig für das Verschieben */
            left: 50px;
            top: 50px;
            cursor: default;
            touch-action: auto;
        }
        .controls {
            position: absolute;
            top: 280px;
            left: 50px;
        }
        button {
            margin-right: 5px;
            padding: 8px 12px;
        }
    </style>
    <!-- Three.js CDN -->
    <script src="https://cloudflare.com"></script>
</head>
<body>

    <div id="farbbox"></div>

    <div class="controls">
        <button id="farbe">mach mich gelb</button>
        <button id="ziehen">Farbbox verschiebbar machen</button>
    </div>

    <script>
        const box = document.getElementById('farbbox');
        const farbeButton = document.getElementById('farbe');
        const ziehenButton = document.getElementById('ziehen');

        // --- THREE.JS INITIALISIERUNG ---
        const scene = new THREE.Scene();
        scene.background = new THREE.Color(0x2be27a); // Startfarbe Grün

        const camera = new THREE.PerspectiveCamera(45, 1, 0.1, 1000);
        camera.position.z = 3;

        const renderer = new THREE.WebGLRenderer({ antialias: true });
        renderer.setSize(200, 200);
        box.appendChild(renderer.domElement);

        // Würfel erstellen
        const geometry = new THREE.BoxGeometry(1, 1, 1);
        const material = new THREE.MeshStandardMaterial({ color: 0xffffff, roughness: 0.3 });
        const cube = new THREE.Mesh(geometry, material);
        scene.add(cube);

        // Licht für 3D-Effekt
        const ambientLight = new THREE.AmbientLight(0xffffff, 0.6);
        scene.add(ambientLight);
        const dirLight = new THREE.DirectionalLight(0xffffff, 0.8);
        dirLight.position.set(2, 4, 3);
        scene.add(dirLight);

        // Automatische Dauerschleife für die Würfel-Rotation
        function animate() {
            requestAnimationFrame(animate);
            cube.rotation.x += 0.01;
            cube.rotation.y += 0.015;
            renderer.render(scene, camera);
        }
        animate();

        // --- DEINE ORIGINAL-INTERAKTIONSLOGIK ---
        let verschiebbar = false;
        let x = 0, y = 0;
        let startX, startY;

        // Farbe ändern
        farbeButton.addEventListener('click', () => {
            scene.background.set(0xffff00); // Setzt das 3D-Canvas auf Gelb
        });

        // Drag-Modus aktivieren/deaktivieren
        ziehenButton.addEventListener('click', () => {
            verschiebbar = !verschiebbar;
            if (verschiebbar) {
                ziehenButton.textContent = 'Verschieben ausschalten';
                box.style.cursor = 'grab';
                box.style.touchAction = 'none';
            } else {
                ziehenButton.textContent = 'Farbbox verschiebbar machen';
                box.style.cursor = 'default';
                box.style.touchAction = 'auto';
            }
        });

        // Zieh-Logik per PointerEvents (verschiebt das komplette HTML-Element)
        box.addEventListener('pointerdown', (event) => {
            if (!verschiebbar) return;
            startX = event.clientX - x;
            startY = event.clientY - y;
            box.setPointerCapture(event.pointerId);
            box.style.cursor = 'grabbing';
        });

        box.addEventListener('pointermove', (event) => {
            if (!verschiebbar || !box.hasPointerCapture(event.pointerId)) return;
            x = event.clientX - startX;
            y = event.clientY - startY;
            box.style.transform = `translate(${x}px, ${y}px)`;
        });

        box.addEventListener('pointerup', (event) => {
            if (verschiebbar) box.style.cursor = 'grab';
        });
    </script>
</body>
</html>
