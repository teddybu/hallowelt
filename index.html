<!DOCTYPE html>
<html lang="de">
<head>
    <meta charset="UTF-8">
    <title>Three.js 3D Farbbox</title>
    <style>
        /* Der Container behält deine Originalgröße */
        #farbbox {
            width: 200px;
            height: 200px;
            margin-bottom: 10px;
            cursor: default;
            touch-action: auto;
        }
        button {
            margin-right: 5px;
            padding: 8px 12px;
        }
    </style>
    <!-- Three.js über CDN einbinden -->
    <script src="https://cloudflare.com"></script>
</head>
<body>

    <!-- Hier wird die 3D-Szene hineingerendert -->
    <div id="farbbox"></div>

    <button id="farbe">mach mich gelb</button>
    <button id="ziehen">3D-Drehung aktivieren</button>

    <script>
        const boxContainer = document.getElementById('farbbox');
        const farbeButton = document.getElementById('farbe');
        const ziehenButton = document.getElementById('ziehen');

        let verschiebbar = false;

        // --- THREE.JS SETUP ---
        const scene = new THREE.Scene();
        scene.background = new THREE.Color(0x2be27a); // Deine Startfarbe

        // Kamera
        const camera = new THREE.PerspectiveCamera(45, 200 / 200, 0.1, 1000);
        camera.position.z = 3;

        // Renderer
        const renderer = new THREE.WebGLRenderer({ antialias: true });
        renderer.setSize(200, 200);
        boxContainer.appendChild(renderer.domElement);

        // 3D-Objekt (Würfel)
        const geometry = new THREE.BoxGeometry(1, 1, 1);
        // MeshStandardMaterial reagiert auf Licht
        const material = new THREE.MeshStandardMaterial({ color: 0xffffff, roughness: 0.4 }); 
        const cube = new THREE.Mesh(geometry, material);
        scene.add(cube);

        // Licht hinzufügen, damit man die 3D-Kanten sieht
        const ambientLight = new THREE.AmbientLight(0xffffff, 0.6);
        scene.add(ambientLight);

        const directionalLight = new THREE.DirectionalLight(0xffffff, 0.8);
        directionalLight.position.set(2, 4, 3);
        scene.add(directionalLight);

        // Animationsschleife (rendert die Szene durchgehend)
        function animate() {
            requestAnimationFrame(animate);
            
            // Eine leichte automatische Drehung, wenn nicht aktiv gedreht wird
            if (!verschiebbar) {
                cube.rotation.x += 0.005;
                cube.rotation.y += 0.005;
            }
            
            renderer.render(scene, camera);
        }
        animate();


        // --- INTERAKTIONEN ---

        // 1. Farbe ändern (ändert den Hintergrund der 3D-Szene)
        farbeButton.addEventListener('click', () => {
            scene.background.set(0xff0000); // Setzt den Hintergrund auf Gelb
            // Optional: Wenn du den Würfel selbst gelb machen willst, nutze: cube.material.color.set(0xffff00);
        });

        // 2. Modus umschalten
        ziehenButton.addEventListener('click', () => {
            verschiebbar = !verschiebbar;
            if (verschiebbar) {
                ziehenButton.textContent = 'Verschieben ausschalten';
                boxContainer.style.cursor = 'grab';
                boxContainer.style.touchAction = 'none';
            } else {
                ziehenButton.textContent = '3D-Drehung aktivieren';
                boxContainer.style.cursor = 'default';
                boxContainer.style.touchAction = 'auto';
            }
        });

        // 3. Pointer-Events für die 3D-Drehung
        let isDragging = false;
        let previousPointerPosition = { x: 0, y: 0 };

        boxContainer.addEventListener('pointerdown', (event) => {
            if (!verschiebbar) return;
            isDragging = true;
            previousPointerPosition = { x: event.clientX, y: event.clientY };
            boxContainer.setPointerCapture(event.pointerId);
            boxContainer.style.cursor = 'grabbing';
        });

        boxContainer.addEventListener('pointermove', (event) => {
            if (!verschiebbar || !isDragging || !boxContainer.hasPointerCapture(event.pointerId)) return;

            // Berechne, wie weit die Maus bewegt wurde
            const deltaMove = {
                x: event.clientX - previousPointerPosition.x,
                y: event.clientY - previousPointerPosition.y
            };

            // Drehe den 3D-Würfel basierend auf der Mausbewegung
            cube.rotation.y += deltaMove.x * 0.01;
            cube.rotation.x += deltaMove.y * 0.01;

            previousPointerPosition = { x: event.clientX, y: event.clientY };
        });

        boxContainer.addEventListener('pointerup', (event) => {
            isDragging = false;
            if (verschiebbar) boxContainer.style.cursor = 'grab';
        });
    </script>
</body>
</html>
