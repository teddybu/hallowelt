<!DOCTYPE html>
<html lang="de">
<head>
  <meta charset="UTF-8">
  <style>
    #farbbox {
      width: 200px;
      height: 200px;
      background: #eeeeee;
      user-select: none;
    }

    #farbbox canvas {
      display: block;
    }
  </style>
</head>
<body>
  <div id="farbbox"></div>
  <button id="farbe">mach mich gelb</button>
  <button id="ziehen">Farbbox verschiebbar machen</button>

  <script type="module">
    import * as THREE from "https://cdn.jsdelivr.net/npm/three@0.160.1/build/three.module.js";

    const farbbox = document.getElementById("farbbox");
    const ziehenButton = document.getElementById("ziehen");

    // 3D-Szene erstellen
    const szene = new THREE.Scene();
    const kamera = new THREE.PerspectiveCamera(50, 1, 0.1, 100);
    kamera.position.z = 4;

    const renderer = new THREE.WebGLRenderer({ antialias: true, alpha: true });
    renderer.setSize(200, 200);
    farbbox.appendChild(renderer.domElement);

    const wuerfel = new THREE.Mesh(
      new THREE.BoxGeometry(1.5, 1.5, 1.5),
      new THREE.MeshStandardMaterial({ color: 0x2be27a })
    );
    szene.add(wuerfel);

    szene.add(new THREE.AmbientLight(0xffffff, 0.8));

    const licht = new THREE.DirectionalLight(0xffffff, 1.5);
    licht.position.set(3, 3, 5);
    szene.add(licht);

    function animieren() {
      requestAnimationFrame(animieren);
      wuerfel.rotation.x += 0.005;
      wuerfel.rotation.y += 0.01;
      renderer.render(szene, kamera);
    }
    animieren();

    // Würfel gelb färben
    document.getElementById("farbe").addEventListener("click", () => {
      wuerfel.material.color.set("yellow");
    });

    // Gesamte Farbbox verschiebbar machen
    let verschiebbar = false;
    let x = 0, y = 0;
    let startX, startY;

    ziehenButton.addEventListener("click", () => {
      verschiebbar = !verschiebbar;
      ziehenButton.textContent = verschiebbar
        ? "Verschieben ausschalten"
        : "Farbbox verschiebbar machen";
      farbbox.style.cursor = verschiebbar ? "grab" : "default";
      farbbox.style.touchAction = verschiebbar ? "none" : "auto";
    });

    farbbox.addEventListener("pointerdown", (event) => {
      if (!verschiebbar || event.button !== 0) return;

      startX = event.clientX - x;
      startY = event.clientY - y;
      farbbox.setPointerCapture(event.pointerId);
    });

    farbbox.addEventListener("pointermove", (event) => {
      if (!verschiebbar || !farbbox.hasPointerCapture(event.pointerId)) return;

      x = event.clientX - startX;
      y = event.clientY - startY;
      farbbox.style.transform = `translate(${x}px, ${y}px)`;
    });
  </script>
</body>
</html>
