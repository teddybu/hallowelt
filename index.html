<!DOCTYPE html>
<html lang="de">
<head>
    <meta charset="UTF-8">
    <title>3D Box mit tagesaktuellem Licht (Garantierte Offline-Version)</title>
    <style>
        body {
            font-family: sans-serif;
            background: #f0f0f0;
            margin: 20px;
        }
        #farbbox {
            width: 200px;
            height: 200px;
            user-select: none;
            position: absolute;
            top: 140px;
            left: 50px;
            border: 1px solid #ccc;
            background: rgba(255, 255, 255, 0.6);
            border-radius: 8px;
            cursor: default;
        }
        #farbbox canvas {
            display: block;
            background: none;
        }
        .controls {
            margin-bottom: 10px;
            display: flex;
            gap: 10px;
            align-items: center;
            flex-wrap: wrap;
        }
        button, input[type="time"] {
            padding: 6px 12px;
            font-size: 14px;
            cursor: pointer;
        }
        label {
            font-size: 14px;
            font-weight: bold;
        }
    </style>
</head>
<body>

<div class="controls">
    <button id="farbe">Mach mich gelb</button>
    <button id="ziehen">Farbbox verschiebbar machen</button>
    
    <label for="zeitRegler">Sonnenstand (Uhrzeit):</label>
    <input type="time" id="zeitRegler">
</div>

<div id="farbbox">
    <canvas id="wuerfelCanvas" width="200" height="200"></canvas>
</div>

<script>
    // --- KEINE VERWENDUNG VON "THREE" MEHR ---
    const farbbox = document.getElementById('farbbox');
    const ziehenButton = document.getElementById('ziehen');
    const farbeButton = document.getElementById('farbe');
    const zeitRegler = document.getElementById('zeitRegler');
    const canvas = document.getElementById('wuerfelCanvas');
    const ctx = canvas.getContext('2d');

    // Würfelfarbe (Standard: Grün)
    let wuerfelBasisFarbe = { r: 43, g: 226, b: 122 };

    // Animations-Winkel
    let winkelX = 0.5;
    let winkelY = 0.5;

    // Licht-Vektor und Licht-Farbe
    let lichtVektor = { x: 0, y: 1, z: 0 };
    let lichtFarbe = { r: 255, g: 255, b: 255 };

    // 8 Eckpunkte eines Würfels (Modell-Koordinaten)
    const knoten = [
        {x: -1, y: -1, z: -1}, {x: 1, y: -1, z: -1},
        {x: 1, y: 1, z: -1},  {x: -1, y: 1, z: -1},
        {x: -1, y: -1, z: 1},  {x: 1, y: -1, z: 1},
        {x: 1, y: 1, z: 1},   {x: -1, y: 1, z: 1}
    ];

    // Die 6 Seitenflächen definiert durch die Eckpunkt-Indizes und deren Normalenvektoren
    const flaechen = [
        { punkte:, normale: {x: 0, y: 0, z: -1} }, // Hinten
        { punkte:, normale: {x: 1, y: 0, z: 0} },  // Rechts
        { punkte:, normale: {x: 0, y: 0, z: 1} },  // Vorne
        { punkte:, normale: {x: -1, y: 0, z: 0} }, // Links
        { punkte:, normale: {x: 0, y: -1, z: 0} }, // Oben
        { punkte:, normale: {x: 0, y: 1, z: 0} }   // Unten
    ];

    // --- Lichtberechnung ---
    function aktualisiereLicht(stunden) {
        // Sonnenposition berechnen (0-24 Uhr = 360 Grad im Kreis)
        const sonnenWinkel = (stunden / 24) * Math.PI * 2 - Math.PI / 2;
        
        // Richtung, aus der das Licht kommt
        lichtVektor.x = Math.cos(sonnenWinkel);
        lichtVektor.y = -Math.sin(sonnenWinkel); 
        lichtVektor.z = 0.5; // Plastischer Vorne-Effekt

        // Vektor normalisieren
        const laenge = Math.sqrt(lichtVektor.x**2 + lichtVektor.y**2 + lichtVektor.z**2);
        lichtVektor.x /= laenge;
        lichtVektor.y /= laenge;
        lichtVektor.z /= laenge;

        // Farben je nach Tageszeit anpassen
        if (stunden >= 6 && stunden < 11) {
            lichtFarbe = { r: 255, g: 180, b: 100 }; // Morgen
        } else if (stunden >= 11 && stunden < 16) {
            lichtFarbe = { r: 255, g: 255, b: 255 }; // Mittag
        } else if (stunden >= 16 && stunden < 21) {
            lichtFarbe = { r: 255, g: 100, b: 50 };  // Abend
        } else {
            lichtFarbe = { r: 100, g: 120, b: 255 }; // Nacht
        }
    }

    // --- Zeit initialisieren ---
    const jetzt = new Date();
    const aktuelleStunden = jetzt.getHours();
    const aktuelleMinuten = jetzt.getMinutes();
    zeitRegler.value = `${String(aktuelleStunden).padStart(2, '0')}:${String(aktuelleMinuten).padStart(2, '0')}`;
    aktualisiereLicht(aktuelleStunden + aktuelleMinuten / 60);

    zeitRegler.addEventListener('input', (e) => {
        const parts = e.target.value.split(':');
        if (parts.length === 2) {
            aktualisiereLicht(parseInt(parts[0], 10) + parseInt(parts[1], 10) / 60);
        }
    });

    farbeButton.addEventListener('click', () => {
        wuerfelBasisFarbe = { r: 255, g: 235, b: 59 }; // Gelb
    });

    // --- 3D Rotation und Rendering ---
    function rotiereX(punkt, winkel) {
        const rad = winkel;
        const cos = Math.cos(rad), sin = Math.sin(rad);
        return { x: punkt.x, y: punkt.y * cos - punkt.z * sin, z: punkt.y * sin + punkt.z * cos };
    }

    function rotiereY(punkt, winkel) {
        const rad = winkel;
        const cos = Math.cos(rad), sin = Math.sin(rad);
        return { x: punkt.x * cos + punkt.z * sin, y: punkt.y, z: -punkt.x * sin + punkt.z * cos };
    }

    function render() {
        ctx.clearRect(0, 0, canvas.width, canvas.height);

        // 1. Alle Punkte rotieren
        const rotierteKnoten = knoten.map(p => {
            let r = rotiereX(p, winkelX);
            return rotiereY(r, winkelY);
        });

        // 2. Flächen berechnen und Tiefensortierung (Painters Algorithm) vornehmen
        const gerenderteFlaechen = flaechen.map(f => {
            let rNormale = rotiereX(f.normale, winkelX);
            rNormale = rotiereY(rNormale, winkelY);

            const zZentrum = (rotierteKnoten[f.punkte[0]].z + rotierteKnoten[f.punkte[1]].z + 
                             rotierteKnoten[f.punkte[2]].z + rotierteKnoten[f.punkte[3]].z) / 4;

            return { flaechenInfo: f, rNormale: rNormale, zZentrum: zZentrum };
        });

        // Sortieren, damit die hinteren Flächen zuerst gezeichnet werden
        gerenderteFlaechen.sort((a, b) => b.zZentrum - a.zZentrum);

        // 3. Flächen zeichnen
        gerenderteFlaechen.forEach(f => {
            if (f.rNormale.z < 0) return;

            // Diffuses Licht berechnen
            let punktProdukt = f.rNormale.x * lichtVektor.x + f.rNormale.y * lichtVektor.y + f.rNormale.z * lichtVektor.z;
            let lichtIntensitaet = Math.max(0.2, punktProdukt); // Mindest-Grundhelligkeit angehoben

            // Mischen der Würfelfarbe mit der Lichtfarbe und Intensität
            let r = Math.min(255, Math.floor((wuerfelBasisFarbe.r * 0.4 + lichtFarbe.r * 0.6) * lichtIntensitaet));
            let g = Math.min(255, Math.floor((wuerfelBasisFarbe.g * 0.4 + lichtFarbe.g * 0.6) * lichtIntensitaet));
            let b = Math.min(255, Math.floor((wuerfelBasisFarbe.b * 0.4 + lichtFarbe.b * 0.6) * lichtIntensitaet));

            ctx.beginPath();
            f.flaechenInfo.punkte.forEach((kIdx, i) => {
                const k = rotierteKnoten[kIdx];
                const x2d = canvas.width / 2 + k.x * 55;
                const y2d = canvas.height / 2 + k.y * 55;

                if (i === 0) ctx.moveTo(x2d, y2d);
                else ctx.lineTo(x2d, y2d);
            });
            ctx.closePath();

            ctx.fillStyle = `rgb(${r}, ${g}, ${b})`;
            ctx.fill();
            ctx.strokeStyle = `rgba(0,0,0,0.15)`;
            ctx.stroke();
        });

        // Kontinuierliche Drehung
        winkelX += 0.005;
        winkelY += 0.01;

        requestAnimationFrame(render);
    }

    // Starten
    render();

    // --- Drag-and-Drop Logik ---
    let verschiebbar = false;
    let istDragging = false;
    let startX, startY, startLeft, startTop;

    ziehenButton.addEventListener('click', () => {
        verschiebbar = !verschiebbar;
        if (verschiebbar) {
            ziehenButton.textContent = "Verschieben ausschalten";
            farbbox.style.cursor = "move";
        } else {
            ziehenButton.textContent = "Farbbox verschiebbar machen";
            farbbox.style.cursor = "default";
            istDragging = false;
        }
    });

    farbbox.addEventListener('mousedown', (e) => {
        if (!verschiebbar) return;
        istDragging = true;
        startX = e.clientX;
        startY = e.clientY;
        startLeft = farbbox.offsetLeft;
        startTop = farbbox.offsetTop;
    });

    document.addEventListener('mousemove', (e) => {
        if (!istDragging) return;
        const deltaX = e.clientX - startX;
        const deltaY = e.clientY - startY;
        farbbox.style.left = (startLeft + deltaX) + 'px';
        farbbox.style.top = (startTop + deltaY) + 'px';
    });

    document.addEventListener('mouseup', () => {
        istDragging = false;
    });
</script>

</body>
</html>
