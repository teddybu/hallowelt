<!DOCTYPE html>
<html lang="de">
<head>
    <meta charset="UTF-8">
    <title>3D Box mit optimiertem Licht & aktueller Zeit</title>
    <style>
        body {
            font-family: sans-serif;
            background: #f0f0f0;
            margin: 20px;
        }
        #farbbox {
            width: 200px;
            height: 200px;
            user-select: none;
            position: absolute;
            top: 140px;
            left: 50px;
            border: 1px solid #ccc;
            background: rgba(255, 255, 255, 0.4); /* Etwas deckender für besseren Kontrast */
            border-radius: 8px;
            cursor: default;
        }
        #farbbox canvas {
            display: block;
            background: none;
        }
        .controls {
            margin-bottom: 10px;
            display: flex;
            gap: 10px;
            align-items: center;
            flex-wrap: wrap;
        }
        button, input[type="time"] {
            padding: 6px 12px;
            font-size: 14px;
            cursor: pointer;
        }
        label {
            font-size: 14px;
            font-weight: bold;
        }
    </style>
</head>
<body>

<div class="controls">
    <button id="farbe">Mach mich gelb</button>
    <button id="ziehen">Farbbox verschiebbar machen</button>
    
    <label for="zeitRegler">Sonnenstand (Uhrzeit):</label>
    <input type="time" id="zeitRegler">
</div>

<div id="farbbox"></div>

<script type="module">
    import * as THREE from 'https://jsdelivr.net';

    const farbbox = document.getElementById('farbbox');
    const ziehenButton = document.getElementById('ziehen');
    const farbeButton = document.getElementById('farbe');
    const zeitRegler = document.getElementById('zeitRegler');

    // --- 3D Szene erstellen ---
    const szene = new THREE.Scene();
    const kamera = new THREE.PerspectiveCamera(50, 1, 0.1, 100);
    kamera.position.z = 4;

    const renderer = new THREE.WebGLRenderer({ antialias: true, alpha: true });
    renderer.setSize(200, 200);
    farbbox.appendChild(renderer.domElement);

    const wuerfel = new THREE.Mesh(
        new THREE.BoxGeometry(1.5, 1.5, 1.5),
        new THREE.MeshStandardMaterial({ color: 0x2be27a, roughness: 0.4, metalness: 0.1 })
    );
    szene.add(wuerfel);

    // --- Licht-Umgebung ---
    // Ein Grundrauschen an Licht, damit der Würfel niemals komplett schwarz wird
    const umgebungsLicht = new THREE.AmbientLight(0xffffff, 0.6); 
    szene.add(umgebungsLicht);

    const sonnenLicht = new THREE.DirectionalLight(0xffffff, 1.5);
    szene.add(sonnenLicht);

    // Funktion zur Berechnung des Lichtes
    function berechneLicht(stunden) {
        // Sonnenbahn berechnen
        const winkel = (stunden / 24) * Math.PI * 2 - Math.PI / 2;
        const radius = 5;
        const x = Math.cos(winkel) * radius;
        const y = Math.sin(winkel) * radius; 
        const z = 4; // Z leicht erhöht, damit das Licht plastischer von vorne kommt
        sonnenLicht.position.set(x, y, z);

        // Helligkeiten und Farben für optimale Sichtbarkeit angepasst
        if (stunden >= 6 && stunden < 11) {
            // Morgen
            sonnenLicht.color.setHex(0xffb566);
            sonnenLicht.intensity = 1.6;
            umgebungsLicht.color.setHex(0xa0b0ff);
            umgebungsLicht.intensity = 0.6;
        } else if (stunden >= 11 && stunden < 16) {
            // Mittag
            sonnenLicht.color.setHex(0xffffff);
            sonnenLicht.intensity = 2.0;
            umgebungsLicht.color.setHex(0xffffff);
            umgebungsLicht.intensity = 0.7;
        } else if (stunden >= 16 && stunden < 21) {
            // Abend
            sonnenLicht.color.setHex(0xff6633);
            sonnenLicht.intensity = 1.5;
            umgebungsLicht.color.setHex(0x706080);
            umgebungsLicht.intensity = 0.6;
        } else {
            // Nacht (Optimiert: Jetzt bleibt der Würfel bläulich sichtbar)
            sonnenLicht.color.setHex(0x5577ff);
            sonnenLicht.intensity = 0.6; 
            umgebungsLicht.color.setHex(0x223366);
            umgebungsLicht.intensity = 0.5;
        }
    }

    // --- Aktuelle Systemzeit auslesen und setzen ---
    const jetzt = new Date();
    const aktuelleStunden = jetzt.getHours();
    const aktuelleMinuten = jetzt.getMinutes();
    
    // Setzt das Eingabefeld exakt auf die aktuelle Uhrzeit
    const formatiert = `${String(aktuelleStunden).padStart(2, '0')}:${String(aktuelleMinuten).padStart(2, '0')}`;
    zeitRegler.value = formatiert;

    // Führt die Lichtberechnung sofort für DIESE Uhrzeit aus
    berechneLicht(aktuelleStunden + aktuelleMinuten / 60);

    // Event Listener bei manueller Änderung
    zeitRegler.addEventListener('input', (e) => {
        const zeitWert = e.target.value;
        if (!zeitWert) return;

        const [stundenStr, minutenStr] = zeitWert.split(':');
        const dezimalStunden = parseInt(stundenStr, 10) + parseInt(minutenStr, 10) / 60;
        
        berechneLicht(dezimalStunden);
    });

    // --- Animationsschleife ---
    function animieren() {
        requestAnimationFrame(animieren);
        wuerfel.rotation.x += 0.005;
        wuerfel.rotation.y += 0.01;
        renderer.render(szene, kamera);
    }
    animieren();

    // Würfel gelb färben
    farbeButton.addEventListener('click', () => {
        wuerfel.material.color.set('yellow');
    });

    // --- Drag-and-Drop ---
    let verschiebbar = false;
    let istDragging = false;
    let startX, startY, startLeft, startTop;

    ziehenButton.addEventListener('click', () => {
        verschiebbar = !verschiebbar;
        if (verschiebbar) {
            ziehenButton.textContent = "Verschieben ausschalten";
            farbbox.style.cursor = "move";
        } else {
            ziehenButton.textContent = "Farbbox verschiebbar machen";
            farbbox.style.cursor = "default";
            istDragging = false;
        }
    });

    farbbox.addEventListener('mousedown', (e) => {
        if (!verschiebbar) return;
        istDragging = true;
        startX = e.clientX;
        startY = e.clientY;
        startLeft = farbbox.offsetLeft;
        startTop = farbbox.offsetTop;
    });

    document.addEventListener('mousemove', (e) => {
        if (!istDragging) return;
        const deltaX = e.clientX - startX;
        const deltaY = e.clientY - startY;
        farbbox.style.left = (startLeft + deltaX) + 'px';
        farbbox.style.top = (startTop + deltaY) + 'px';
    });

    document.addEventListener('mouseup', () => {
        istDragging = false;
    });
</script>

</body>
</html>
